name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the toolchain so CI renders exactly what we render locally.
  HUGO_VERSION: '0.165.0'
  HUGO_ENVIRONMENT: production
  TZ: Europe/Warsaw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error --silent \
            --output /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg --install /tmp/hugo.deb
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # .GitInfo / .Lastmod need full history

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'themes/**') }}
          restore-keys: hugo-resources-${{ runner.os }}-

      - name: Build
        # base_url is the custom domain when one is configured in repo settings,
        # and the project subpath otherwise, so the build is correct either way.
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify output
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/404.html
          test -d public/fonts
          echo "built $(find public -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
