<dialog class="lightbox" data-lightbox-dialog aria-label="Screenshot viewer">
  <div class="lightbox__frame">
    <div class="window__bar lightbox__bar">
      <span data-lightbox-caption></span>
      <button type="button" class="lightbox__close" data-lightbox-close aria-label="Close viewer">Esc ✕</button>
    </div>
    <div class="lightbox__stage" data-lightbox-stage>
      <img data-lightbox-img alt="">
    </div>
    <div class="lightbox__controls" data-lightbox-controls>
      <button type="button" data-lightbox-prev aria-label="Previous screenshot">← <span>Prev</span></button>
      <button type="button" data-lightbox-next aria-label="Next screenshot"><span>Next</span> →</button>
    </div>
  </div>
</dialog>
